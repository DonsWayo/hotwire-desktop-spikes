name: Spike 3 — relocatable Ruby on Windows

# The Windows gate from the feasibility study, run on a free public runner.
#
# Three questions, none of which anyone appears to have published an answer to:
#   1. Does the portable RubyInstaller archive actually relocate?
#   2. Does it survive a path with a space in it? A real app installs to
#      C:\Program Files\<name>\, and the RubyInstaller FAQ warns that spaces
#      break gem installation.
#   3. Can Rails boot from it WITHOUT shipping the MSYS2 devkit? If precompiled
#      gems cover everything, the Windows payload is small. If puma or sqlite3
#      need a compiler, the whole packaging story changes.

on:
  workflow_dispatch:
  push:
    paths: [".github/workflows/spike03-windows-ruby.yml"]

env:
  RUBY_VERSION: "3.4.10"      # newest 3.4.x with a portable archive

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Fetch the portable archive (no installer, no devkit)
        shell: pwsh
        run: |
          $v = $env:RUBY_VERSION
          $url = "https://github.com/oneclick/rubyinstaller2/releases/download/RubyInstaller-$v-1/rubyinstaller-$v-1-x64.7z"
          Write-Host "Downloading $url"
          curl.exe -fsSL -o ruby.7z $url
          7z x ruby.7z -oC:\unpacked | Out-Null
          $dir = (Get-ChildItem C:\unpacked | Select-Object -First 1).FullName
          Write-Host "Unpacked to $dir"
          "RUBY_SRC=$dir" | Out-File -Append $env:GITHUB_ENV

      # 1 -------------------------------------------------------------------
      - name: 1. Relocates to a clean path
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path C:\relocated | Out-Null
          Copy-Item -Recurse "$env:RUBY_SRC" C:\relocated\ruby
          $v = & C:\relocated\ruby\bin\ruby.exe -v
          if (-not $v) { throw "ruby did not run after being moved" }
          Write-Host "OK  $v"
          & C:\relocated\ruby\bin\ruby.exe -e 'require "psych"; raise "psych broken" unless Psych.load("- 1") == [1]; puts "OK  psych #{Psych::VERSION} (libyaml #{Psych::LIBYAML_VERSION})"'
          & C:\relocated\ruby\bin\ruby.exe -e 'require "openssl"; puts "OK  #{OpenSSL::OPENSSL_VERSION}"'
          & C:\relocated\ruby\bin\ruby.exe -e 'puts "OK  prefix follows binary: #{RbConfig::CONFIG["prefix"]}"'

      # 2 -------------------------------------------------------------------
      - name: 2. Survives a path with a space (C:\Program Files style)
        shell: pwsh
        continue-on-error: true      # a failure here is a finding, not a broken job
        id: spaces
        run: |
          $target = "C:\Program Files Test\Hotwire Desktop\ruby"
          New-Item -ItemType Directory -Force -Path (Split-Path $target) | Out-Null
          Copy-Item -Recurse "$env:RUBY_SRC" $target
          & "$target\bin\ruby.exe" -v
          Write-Host "--- gem install into a spaced path (the FAQ says this breaks) ---"
          $env:GEM_HOME = "C:\Program Files Test\Hotwire Desktop\gems"
          & "$target\bin\gem.cmd" install json --no-document
          if ($LASTEXITCODE -ne 0) { throw "gem install failed in a path containing spaces" }
          Write-Host "OK  gem install worked in a path with spaces"

      # 3 -------------------------------------------------------------------
      - name: 3a. Which gems have no precompiled Windows binary?
        shell: pwsh
        continue-on-error: true
        id: fullrails
        run: |
          $ruby = "C:\relocated\ruby"
          $env:GEM_HOME = "C:\probe-gems"
          Write-Host "--- installing the full rails meta-gem, purely to see what breaks ---"
          & "$ruby\bin\gem.cmd" install rails --no-document 2>&1 | Tee-Object -Variable out
          $out | Select-String "Building native extensions|ERROR|Gem files will remain" | ForEach-Object { Write-Host "  $_" }
          if ($LASTEXITCODE -ne 0) {
            Write-Host "::warning::the full rails meta-gem needs a compiler on Windows"
          }

      - name: 3b. The lean set a desktop app actually needs
        shell: pwsh
        continue-on-error: true
        id: lean
        run: |
          # A desktop app has one user and no cable server, so ActionCable — and
          # its websocket-driver dependency, which ships no x64-mingw-ucrt binary
          # — is not part of the payload. Turbo Streams ride SSE instead.
          $ruby = "C:\relocated\ruby"
          $env:GEM_HOME = "C:\relocated\gems"
          $env:GEM_PATH = "C:\relocated\gems;$ruby\lib\ruby\gems\3.4.0"
          $env:PATH     = "$ruby\bin;C:\relocated\gems\bin;$env:PATH"
          $dirs = @("C:\relocated\gems\bin", "$ruby\bin")

          # Stop guessing extensions. RubyInstaller ships .cmd wrappers in
          # ruby\bin, RubyGems writes .bat binstubs into GEM_HOME\bin, and which
          # one exists for a given tool is not something to assume. Resolve, and
          # if it is missing, print the directory rather than fail blind.
          function Resolve-Bin([string]$name, [string[]]$dirs) {
            foreach ($d in $dirs) {
              foreach ($ext in @(".cmd", ".bat", "")) {
                $p = Join-Path $d ($name + $ext)
                if (Test-Path $p) { return $p }
              }
            }
            Write-Host "could not find a '$name' binstub. Contents:"
            foreach ($d in $dirs) {
              Write-Host "  $d :"
              if (Test-Path $d) { Get-ChildItem $d | ForEach-Object { Write-Host "      $($_.Name)" } }
              else { Write-Host "      (missing)" }
            }
            throw "no '$name' binstub found"
          }

          $gem = Resolve-Bin "gem" @("$ruby\bin")
          Write-Host "--- railties provides the rails command without actioncable ---"
          & $gem install railties --no-document
          if ($LASTEXITCODE -ne 0) { throw "railties failed to install" }

          $rails = Resolve-Bin "rails" $dirs
          Write-Host "using $rails"
          & $rails new C:\relocated\app --minimal --skip-git --skip-bundle --skip-action-cable
          if (-not (Test-Path C:\relocated\app\Gemfile)) { throw "rails new produced no app" }

          Write-Host "--- pinning the Gemfile to the lean set ---"
          @(
            'source "https://rubygems.org"'
            'gem "railties", "~> 8.1"'
            'gem "actionpack", "~> 8.1"'
            'gem "activerecord", "~> 8.1"'
            'gem "propshaft"'
            'gem "puma"'
            'gem "sqlite3"'
            'gem "tzinfo-data", platforms: %i[windows jruby]'
          ) | Set-Content C:\relocated\app\Gemfile

          $bundle = Resolve-Bin "bundle" $dirs
          Write-Host "using $bundle"
          Push-Location C:\relocated\app
          & $bundle install 2>&1 | Tee-Object -Variable out
          $code = $LASTEXITCODE
          Pop-Location
          $native = $out | Select-String "with native extensions"
          if ($code -ne 0) {
            Write-Host "::error::even the lean set needs a compiler on Windows"
            throw "bundle install failed"
          }
          if ($native) {
            Write-Host "::warning::compiled from source (a toolchain is required):"
            $native | ForEach-Object { Write-Host "    $_" }
          } else {
            Write-Host "OK  every gem resolved to a precompiled binary — no devkit needs shipping"
          }

      - name: 3c. CI builds the gems, with the toolchain it already has
        shell: pwsh
        run: |
          # Reframing after 3b. The question was never "can gems install without
          # a compiler" — an end user never installs gems, they double-click a
          # bundle somebody else built. The real questions are whether CI can
          # build them, and whether the *result* runs with no toolchain present.
          #
          # io-console and puma both ship source-only on Windows, so a compiler
          # is required at build time. windows-latest carries MSYS2 already, it
          # is simply not on PATH.
          $ruby = "C:\relocated\ruby"
          $env:GEM_HOME = "C:\relocated\gems2"
          $env:GEM_PATH = "C:\relocated\gems2;$ruby\lib\ruby\gems\3.4.0"
          $env:PATH     = "C:\msys64\mingw64\bin;C:\msys64\usr\bin;$ruby\bin;$env:PATH"
          Write-Host "gcc: $((Get-Command gcc -ErrorAction SilentlyContinue).Source)"

          New-Item -ItemType Directory -Force -Path C:\relocated\app2 | Out-Null
          Copy-Item -Recurse -Force C:\relocated\app\* C:\relocated\app2 -ErrorAction SilentlyContinue
          @(
            'source "https://rubygems.org"'
            'gem "railties", "~> 8.1"'
            'gem "actionpack", "~> 8.1"'
            'gem "activerecord", "~> 8.1"'
            'gem "propshaft"'
            'gem "puma"'
            'gem "sqlite3"'
            'gem "tzinfo-data", platforms: %i[windows jruby]'
          ) | Set-Content C:\relocated\app2\Gemfile

          Push-Location C:\relocated\app2
          & "$ruby\bin\bundle.cmd" install 2>&1 | Tee-Object -Variable out
          $code = $LASTEXITCODE
          Pop-Location
          if ($code -ne 0) {
            $out | Select-Object -Last 25 | ForEach-Object { Write-Host "    $_" }
            throw "CI could not build the bundle even with MSYS2 on PATH"
          }
          Write-Host "compiled during the build:"
          ($out | Select-String "with native extensions") | ForEach-Object { Write-Host "    $_" }
          Write-Host "OK  CI built the full bundle"

      - name: 3d. The built bundle runs with NO toolchain present
        shell: pwsh
        run: |
          # The shipping test. Move everything somewhere else, take MSYS2 off
          # PATH entirely, and boot. If this passes, the user needs no compiler
          # and Windows is a packaging problem rather than a blocker.
          $ruby = "C:\shipped\ruby"
          New-Item -ItemType Directory -Force -Path C:\shipped | Out-Null
          Copy-Item -Recurse C:\relocated\ruby   C:\shipped\ruby
          Copy-Item -Recurse C:\relocated\gems2  C:\shipped\gems
          Copy-Item -Recurse C:\relocated\app2   C:\shipped\app

          if (Test-Path C:\msys64) { Rename-Item C:\msys64 C:\msys64-hidden }
          $env:PATH = "$ruby\bin;C:\Windows\system32;C:\Windows"
          Write-Host "gcc on PATH now: $((Get-Command gcc -ErrorAction SilentlyContinue).Source ?? 'none — good')"

          $env:GEM_HOME = "C:\shipped\gems"
          $env:GEM_PATH = "C:\shipped\gems;$ruby\lib\ruby\gems\3.4.0"
          $env:RAILS_ENV = "production"
          $env:SECRET_KEY_BASE_DUMMY = "1"
          Copy-Item "$env:GITHUB_WORKSPACE\spike03-windows-ruby\boot_check.rb" C:\shipped\app\boot_check.rb
          Push-Location C:\shipped\app
          & "$ruby\bin\ruby.exe" boot_check.rb
          $code = $LASTEXITCODE
          Pop-Location
          if (Test-Path C:\msys64-hidden) { Rename-Item C:\msys64-hidden C:\msys64 }
          if ($code -ne 0) { throw "the built bundle does not run without a toolchain" }

      - name: Payload size
        shell: pwsh
        if: always()
        run: |
          function Size($p) { if (Test-Path $p) { "{0:N0} MB" -f ((Get-ChildItem $p -Recurse -File -EA SilentlyContinue | Measure-Object Length -Sum).Sum / 1MB) } else { "n/a" } }
          Write-Host "interpreter  $(Size 'C:\shipped\ruby')"
          Write-Host "app gems     $(Size 'C:\shipped\gems')"
          Write-Host "app gems     $(Size 'C:\relocated\gems')"
          Write-Host "the app      $(Size 'C:\relocated\app')"

      - name: Summary
        shell: pwsh
        if: always()
        run: |
          $spaces = if ("${{ steps.spaces.outcome }}" -eq "success") { "survives spaces in the path" } else { "FAILS in a path with spaces" }
          Write-Host "Windows gate: $spaces"
          "## Spike 3 - Windows gate" | Out-File -Append $env:GITHUB_STEP_SUMMARY
          "" | Out-File -Append $env:GITHUB_STEP_SUMMARY
          "- Spaced path: $spaces" | Out-File -Append $env:GITHUB_STEP_SUMMARY
          "- Full rails meta-gem: ${{ steps.fullrails.outcome }} (needs a compiler if failure)" | Out-File -Append $env:GITHUB_STEP_SUMMARY
